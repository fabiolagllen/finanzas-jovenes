<main class="profile-wrap"><div class="profile-heading"><span class="eyebrow">👤 MI CUENTA</span><h1>Mi perfil</h1><p>Administra tu información personal.</p></div><section class="profile-card"><div class="identity"><div class="avatar" id="avatar">👤</div><h2 id="displayName">Mi perfil</h2><div class="email" id="email"></div><p class="bio" id="displayBio">Aún no has agregado una descripción.</p></div><div class="divider"></div><h3 class="edit-title">✏️ Editar perfil</h3><div class="form"><label>Nombre</label><input id="name" maxlength="80" placeholder="Tu nombre"><label>Apodo</label><input id="nickname" maxlength="30" placeholder="¿Cómo quieres que te llamemos?"><label>Sobre mí</label><textarea id="bio" maxlength="180" rows="4" placeholder="Escribe algo sobre ti..."></textarea><label>Foto de perfil (URL)</label><input id="avatarUrl" type="url" placeholder="Pega el enlace de una imagen"><div class="actions"><button class="primary" onclick="saveProfilePage()">Guardar cambios 💾</button></div><div class="msg" id="msg"></div></div><div class="account"><p>Tu información del perfil pertenece a tu cuenta.</p><button class="secondary" onclick="logoutPage()">Cerrar sesión 🚪</button></div></section></main>

<script>
const SUPABASE_URL='https://pgfgmxeqisrwkrwtvbum.supabase.co',SUPABASE_KEY='sb_publishable_6al9XSM0nTc6-RlkX2UUrw_SLaQdwEh';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null;
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
async function init(){const {data:{user:u}}=await db.auth.getUser();if(!u){location.href='./index.html';return}user=u;const {data:p}=await db.from('profiles').select('full_name,nickname,bio,avatar_url').eq('id',u.id).maybeSingle();fillProfile(p||{});}
function fillProfile(p){const name=p.nickname||p.full_name||'Mi perfil';document.getElementById('displayName').textContent=name;document.getElementById('email').textContent=user.email||'';document.getElementById('displayBio').textContent=p.bio||'Aún no has agregado una descripción.';document.getElementById('name').value=p.full_name||'';document.getElementById('nickname').value=p.nickname||'';document.getElementById('bio').value=p.bio||'';document.getElementById('avatarUrl').value=p.avatar_url||'';const av=document.getElementById('avatar');av.innerHTML=p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="Foto de perfil">':esc((name[0]||'U').toUpperCase());}
async function saveProfilePage(){const full_name=document.getElementById('name').value.trim(),nickname=document.getElementById('nickname').value.trim(),bio=document.getElementById('bio').value.trim(),avatar_url=document.getElementById('avatarUrl').value.trim();const {error}=await db.from('profiles').upsert({id:user.id,full_name,nickname,bio,avatar_url,updated_at:new Date().toISOString()},{onConflict:'id'});const m=document.getElementById('msg');if(error){m.textContent='No se pudieron guardar los cambios.';return}m.textContent='Perfil actualizado correctamente. 💚';fillProfile({full_name,nickname,bio,avatar_url});}
async function logoutPage(){await db.auth.signOut();location.href='./index.html';}
init();
</script>

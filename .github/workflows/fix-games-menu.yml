name: Fix Games Menu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix Games anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('games.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("nav.querySelector('a[href=\"#juegos\"])", "nav.querySelector('a[href=\"#fjGames\"])")
          s = s.replace("link.href='#juegos'", "link.href='#fjGames'")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Games menu anchor'
          git push

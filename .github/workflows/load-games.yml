name: Load games into site

on:
  push:
    paths:
      - 'games.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add games script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="games.js"></script>'
          if tag not in text:
              marker = '<script src="chatbot.js"></script>'
              if marker not in text:
                  raise SystemExit('No se encontró el punto de inserción.')
              text = text.replace(marker, tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'games.js ya está cargado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Cargar centro de juegos en la pagina'
          git push

name: Enable Mobile App UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-mobile-app:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject mobile app script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="mobile-app.js"></script>'
          if marker not in text:
              text = text.replace('</body>', marker + '\n</body>')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit mobile app activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Mobile app already active."
            exit 0
          fi
          git commit -m "Activar experiencia móvil tipo aplicación [skip ci]"
          git push
